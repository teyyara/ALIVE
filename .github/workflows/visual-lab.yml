name: ALIVE Visual Lab

on:
  workflow_dispatch:

jobs:
  visual-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/visual-lab.mjs

      - name: Upload visual lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alive-visual-lab
          path: lab-output/
          if-no-files-found: warn
