name: ALIVE self-view

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'index.html'
      - '.github/workflows/alive-self-view.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright
        run: |
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium

      - name: Start Vite server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/alive-server.log 2>&1 &
          echo $! > /tmp/alive-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alive-server.log
          exit 1

      - name: Run self-view lab
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageChops, ImageStat
          import json
          from pathlib import Path
          
          out = Path("lab/latest")
          out.mkdir(parents=True, exist_ok=True)
          errors = []
          
          states = [
              ("idle", "center"),
              ("curious", "left"),
              ("thinking", "right"),
              ("speaking", "center"),
          ]
          
          def eye_clip(page):
              box = page.locator("#character-stage").bounding_box()
              if not box:
                  raise RuntimeError("Character stage has no bounding box.")
              return {
                  "x": box["x"] + box["width"] * 0.31,
                  "y": box["y"] + box["height"] * 0.28,
                  "width": box["width"] * 0.38,
                  "height": box["height"] * 0.17,
              }
          
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, device_scale_factor=1)
              page.on("pageerror", lambda e: errors.append({"type": "pageerror", "text": str(e)}))
              page.on("console", lambda m: errors.append({"type": m.type, "text": m.text}) if m.type in {"error", "warning"} else None)
              
              for state, gaze in states:
                  page.goto(f"http://127.0.0.1:4173/?lab={state}&gaze={gaze}", wait_until="domcontentloaded")
                  page.wait_for_timeout(700)
                  page.screenshot(path=str(out / f"{state}-{gaze}.png"), full_page=True)
                  if state in {"idle", "curious"}:
                      page.screenshot(path=str(out / f"eyes-{state}-{gaze}.png"), clip=eye_clip(page))
              
              # Deterministic blink capture, while the eyelid is actually moving.
              page.goto("http://127.0.0.1:4173/?lab=idle&gaze=center", wait_until="domcontentloaded")
              page.wait_for_timeout(450)
              page.evaluate("window.__ALIVE_TEST__.blink()")
              page.wait_for_timeout(65)
              blink_state = page.evaluate("window.__ALIVE_TEST__.getCharacter()")
              page.screenshot(path=str(out / "blink-center.png"), full_page=True)
              page.screenshot(path=str(out / "eyes-blink.png"), clip=eye_clip(page))
              
              if blink_state["blink"] < 0.18:
                  raise SystemExit(f"Blink did not reach visible range: {blink_state}")
              
              # True interaction check, not URL state injection.
              page.goto("http://127.0.0.1:4173/", wait_until="domcontentloaded")
              page.wait_for_timeout(400)
              box = page.locator("#character-stage").bounding_box()
              page.mouse.move(box["x"] + box["width"] * .78, box["y"] + box["height"] * .42)
              page.wait_for_timeout(350)
              gaze_state = page.evaluate("window.__ALIVE_TEST__?.getCharacter?.()")
              if gaze_state is None or gaze_state["gazeX"] < 0.08:
                  raise SystemExit(f"Pointer attention did not move character gaze: {gaze_state}")
              
              page.locator("#message").fill("hello ALIVE")
              page.wait_for_timeout(120)
              if page.locator("#state-label").inner_text() != "Curious":
                  raise SystemExit("Typing did not move ALIVE into Curious state.")
              
              page.locator("#composer").evaluate("(form) => form.requestSubmit()")
              page.wait_for_timeout(330)
              if page.locator("#state-label").inner_text() != "Thinking":
                  raise SystemExit("Conversation did not enter Thinking state.")
              
              page.wait_for_timeout(800)
              if page.locator("#messages .alive").count() < 1:
                  raise SystemExit("Conversation did not produce an ALIVE response.")
              
              page.screenshot(path=str(out / "interaction.png"), full_page=True)
              browser.close()
          
          # Pixel-level proof that gaze is changing the eye region.
          center = Image.open(out / "eyes-idle-center.png").convert("RGB")
          left = Image.open(out / "eyes-curious-left.png").convert("RGB")
          diff = ImageChops.difference(center, left)
          mean_diff = sum(ImageStat.Stat(diff).mean) / 3
          blink = Image.open(out / "eyes-blink.png").convert("RGB")
          blink_diff = ImageChops.difference(center, blink)
          blink_mean = sum(ImageStat.Stat(blink_diff).mean) / 3
          
          diagnostics = {
              "browser_errors": errors,
              "gaze_eye_region_mean_difference": mean_diff,
              "blink_eye_region_mean_difference": blink_mean,
              "snapshots": len(list(out.glob("*.png"))),
          }
          Path("lab/latest/browser-errors.json").write_text(json.dumps(diagnostics, indent=2))
          print(json.dumps(diagnostics))
          
          # The browser rendered successfully; visual thresholds are deliberately permissive.
          if mean_diff < 0.10:
              raise SystemExit(f"Eye-region gaze difference is too small: {mean_diff}")
          if blink_mean < 0.10:
              raise SystemExit(f"Eye-region blink difference is too small: {blink_mean}")
          if errors:
              raise SystemExit(f"Browser reported {len(errors)} errors/warnings.")
          PY

      - name: Commit latest visual snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/latest
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh ALIVE self-view snapshots [skip ci]"
          git push

      - name: Fail when browser reports errors or warnings
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          errors = json.loads(Path("lab/latest/browser-errors.json").read_text())
          if errors:
              raise SystemExit(f"Browser reported {len(errors)} errors/warnings. See lab/latest/browser-errors.json")
          PY
